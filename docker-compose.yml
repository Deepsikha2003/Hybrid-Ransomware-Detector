services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rds}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-rds}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rds}"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      ENV: production
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-rds}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-rds}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?set ADMIN_EMAIL in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      MODEL_DIR: /srv/models
      UPLOAD_DIR: /srv/uploads
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
    volumes:
      - ./backend/models:/srv/models
      - uploads:/srv/uploads
    depends_on:
      db: { condition: service_healthy }
    restart: unless-stopped

  frontend:   # React build served by Nginx, which also reverse-proxies /api to the backend
    build: ./frontend
    ports: ["8080:80"]
    depends_on: [backend]
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
